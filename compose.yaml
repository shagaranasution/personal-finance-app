# Local development only. These credentials must never be reused for deployment.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: local_finance_only
      POSTGRES_DB: finance
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance -d finance']
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
